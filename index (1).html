<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b33"><title>Number Merge PLUS | 넘버 머지</title><meta name="description" content="Play Number Merge PLUS, a free 2048-inspired number puzzle with combo bonuses. Works on desktop and mobile."><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#eef3ff;background:#0b1224}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#253c68 0%,#101b33 38%,#0b1224 100%);display:flex;justify-content:center}.wrap{width:min(94vw,510px);padding:28px 0 45px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{color:#89a8ee;font-size:11px;font-weight:800;letter-spacing:2px}h1{font-size:clamp(26px,7vw,38px);letter-spacing:-1.5px;margin:4px 0}.subtitle{color:#9baac7;font-size:13px;margin:0 0 18px}.scores{display:flex;gap:7px}.score{background:#202f4f;border:1px solid #385078;border-radius:13px;padding:9px 12px;text-align:center;min-width:75px;font-size:11px;color:#a8b9dc}.score strong{display:block;font-size:22px;color:white}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.toolbar p{color:#9baac7;font-size:13px;margin:0}.actions{display:flex;gap:7px}button{border:0;border-radius:11px;padding:11px 13px;font-size:13px;font-weight:800;cursor:pointer;color:#101b33;background:#f7c65f;touch-action:manipulation}button.secondary{background:#263857;color:#dfe9ff;border:1px solid #3b5076}button:focus-visible{outline:3px solid #91baff;outline-offset:2px}.lang-toggle{font-size:12px;min-width:48px}.board-wrap{position:relative;padding:10px;background:#344361;border:1px solid #546585;border-radius:19px;box-shadow:0 22px 55px #0005}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:9px;width:100%;aspect-ratio:1/1;min-width:0;min-height:0;touch-action:none;user-select:none}.tile{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;border-radius:12px;background:#52617b;color:#fff;font-size:clamp(18px,6.4vw,36px);font-weight:900;line-height:1;box-shadow:inset 0 -3px 0 #0001;transition:background-color .13s,transform .15s;position:relative}.tile[data-n="2"]{background:#e4edff;color:#34466a}.tile[data-n="4"]{background:#b8d8ff;color:#29456c}.tile[data-n="8"]{background:#7eb5ff;color:#153259}.tile[data-n="16"]{background:#6390fa}.tile[data-n="32"]{background:#796ef3}.tile[data-n="64"]{background:#a56cf0}.tile[data-n="128"]{background:#e18fe8;font-size:30px}.tile[data-n="256"]{background:#ef8db4;font-size:30px}.tile[data-n="512"]{background:#f58b78;font-size:30px}.tile[data-n="1024"]{background:#f4a955;font-size:25px}.tile[data-n="2048"]{background:#f9cc4c;color:#45300b;font-size:25px}.tile[data-n="4096"],.tile[data-n="8192"]{background:#41cbb5;font-size:23px}.tile.pop{animation:pop .24s ease-out}.tile.merge{animation:merge .32s ease-out}@keyframes pop{0%{transform:scale(.55);opacity:.35}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@keyframes merge{0%{transform:scale(.86);filter:brightness(1.6)}55%{transform:scale(1.16)}100%{transform:scale(1)}}.flash{animation:flash .3s ease}@keyframes flash{50%{filter:brightness(1.35)}}.combo-banner{height:40px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:900;color:#ffd16c}.combo-banner strong{font-size:20px}.combo-banner.active{animation:combo .32s ease-out}@keyframes combo{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}.status{min-height:25px;text-align:center;color:#c2d3f4;font-weight:800;font-size:14px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:192px;margin:13px auto}.controls button{padding:9px;background:#263857;color:white;border:1px solid #41567a;font-size:19px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.info{background:#15233d;border:1px solid #2b3e60;border-radius:14px;padding:14px 16px;margin-top:16px;color:#b6c5e1;font-size:13px;line-height:1.65}.info strong{color:#fff}.ad-placeholder{border:1px dashed #4b5974;border-radius:12px;color:#7e8da8;text-align:center;font-size:11px;padding:17px;margin-top:19px}.foot{text-align:center;font-size:11px;color:#7e8da8;margin-top:16px}.overlay{position:absolute;inset:10px;background:#0c1739d9;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:20px;z-index:3}.overlay[hidden]{display:none}.overlay h2{font-size:30px;margin:0}.overlay p{margin:0;color:#c0cfea}.overlay button{margin-top:7px}.pill{font-size:11px;color:#9eb0d6;background:#213252;border-radius:30px;padding:5px 10px}@media(prefers-reduced-motion:reduce){.tile,.combo-banner,.flash{animation:none!important;transition:none!important}}@media(max-width:390px){.score{min-width:62px;padding:8px}.score strong{font-size:18px}.board{gap:7px}.wrap{padding-top:17px}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">PUZZLE ARCADE</div><h1><span data-i18n="title">넘버 머지</span> <span style="color:#f7c65f">+</span></h1><p class="subtitle"><span data-i18n="subtitle">숫자를 합쳐 2048에 도전하세요!</span></p></div><div class="scores"><div class="score"><span data-i18n="scoreLabel">점수</span><strong id="score">0</strong></div><div class="score"><span data-i18n="bestLabel">최고</span><strong id="best">0</strong></div></div></header><div class="toolbar"><p data-i18n="tip">연속 합치기로 콤보 보너스!</p><div class="actions"><button id="language" class="secondary lang-toggle" aria-label="Switch language">EN</button><button id="sound" class="secondary" aria-label="효과음 켜기 또는 끄기" aria-pressed="true"><span id="soundText">🔊 소리</span></button><button id="restart"><span data-i18n="newGame">↻ 새 게임</span></button></div></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="4x4 숫자 퍼즐"></div><div id="overlay" class="overlay" hidden><span class="pill">NUMBER MERGE +</span><h2 id="overlayTitle"></h2><p id="overlayText"></p><button id="overlayButton"><span data-i18n="again">다시 시작</span></button></div></div><div id="comboBanner" class="combo-banner" aria-live="polite"><span data-i18n="comboPrompt">같은 숫자를 합쳐보세요 ✨</span></div><div id="status" class="status" aria-live="polite"></div><div class="controls" aria-label="방향 버튼"><button class="up" data-dir="up" aria-label="위">↑</button><button class="left" data-dir="left" aria-label="왼쪽">←</button><button class="down" data-dir="down" aria-label="아래">↓</button><button class="right" data-dir="right" aria-label="오른쪽">→</button></div><div class="info"><strong data-i18n="howTitle">플레이 방법</strong><div data-i18n="howBody">PC: 방향키 또는 WASD · 스마트폰: 스와이프<br>숫자가 합쳐지는 이동을 연속으로 성공하면 <strong>2배~5배 콤보 점수</strong>를 받습니다. 합치지 못한 이동을 하면 콤보가 초기화됩니다.</div></div><div class="ad-placeholder"><span data-i18n="ad">광고 영역 예시 · 현재 실제 광고는 연결되어 있지 않습니다</span></div><div class="foot"><span data-i18n="footer">HTML5 · 설치 없이 즐기는 퍼즐 게임</span></div></main><script>
'use strict';
const SIZE=4,board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),comboEl=document.getElementById('comboBanner'),overlay=document.getElementById('overlay');
let grid,score,won,over,combo=0,soundOn=true,audioContext=null;
const messages={ko:{title:'넘버 머지',subtitle:'숫자를 합쳐 2048에 도전하세요!',scoreLabel:'점수',bestLabel:'최고',tip:'연속 합치기로 콤보 보너스!',newGame:'↻ 새 게임',again:'다시 시작',continue:'계속 플레이',comboPrompt:'같은 숫자를 합쳐보세요 ✨',first:'✨ 첫 합치기! 다음 합치기로 콤보 시작',combo:'연속 합치기',win:'🎉 2048 달성! 계속 도전할 수 있어요.',winTitle:'2048 달성! 🎉',winText:'훌륭해요! 계속 플레이할 수 있습니다.',overTitle:'게임 종료!',final:'최종 점수',howTitle:'플레이 방법',howBody:'PC: 방향키 또는 WASD · 스마트폰: 스와이프<br>숫자가 합쳐지는 이동을 연속으로 성공하면 <strong>2배~5배 콤보 점수</strong>를 받습니다. 합치지 못한 이동을 하면 콤보가 초기화됩니다.',ad:'광고 영역 예시 · 현재 실제 광고는 연결되어 있지 않습니다',footer:'HTML5 · 설치 없이 즐기는 퍼즐 게임',soundOn:'🔊 소리',soundOff:'🔇 음소거',empty:'빈 칸'},en:{title:'Number Merge',subtitle:'Merge tiles and reach 2048!',scoreLabel:'SCORE',bestLabel:'BEST',tip:'Keep merging to earn combo bonuses!',newGame:'↻ New Game',again:'Play Again',continue:'Keep Playing',comboPrompt:'Merge matching numbers ✨',first:'✨ First merge! Merge again for a combo',combo:'consecutive merges',win:'🎉 You reached 2048! Keep going.',winTitle:'2048 reached! 🎉',winText:'Great job! You can keep playing.',overTitle:'Game Over!',final:'Final score:',howTitle:'How to play',howBody:'Desktop: arrow keys or WASD · Mobile: swipe<br>Merge tiles on consecutive moves to earn <strong>2×–5× combo points</strong>. A move without a merge resets your combo.',ad:'Ad placement preview · No live ads are connected',footer:'HTML5 · Free browser puzzle, no installation',soundOn:'🔊 Sound',soundOff:'🔇 Muted',empty:'Empty'}};
let lang='en';try{lang=localStorage.getItem('numberMergeLanguage')||'en'}catch{}if(!messages[lang])lang='en';
const t=k=>messages[lang][k];
function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(k==='howBody')el.innerHTML=t(k);else el.textContent=t(k)});document.getElementById('language').textContent=lang==='en'?'한국어':'EN';document.getElementById('soundText').textContent=t(soundOn?'soundOn':'soundOff');document.getElementById('overlayButton').textContent=over?t('again'):won&&!overlay.hidden?t('continue'):t('again');render();if(!overlay.hidden){if(over)showOverlay(t('overTitle'),`${t('final')} ${score.toLocaleString(lang==='ko'?'ko-KR':'en-US')}`);else showOverlay(t('winTitle'),t('winText'))}}

function getBest(){try{return Number(localStorage.getItem('numberMergeBest'))||0}catch{return 0}}
function setBest(n){try{localStorage.setItem('numberMergeBest',String(n))}catch{}}
function emptyCells(){const a=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])a.push([r,c]);return a}
function spawn(){const a=emptyCells();if(!a.length)return null;const [r,c]=a[Math.floor(Math.random()*a.length)];grid[r][c]=Math.random()<.9?2:4;return `${r}-${c}`}
function sound(kind){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime;const notes=kind==='win'?[523,659,784,1047]:kind==='merge'?[440+Math.min(combo,5)*70,660+Math.min(combo,5)*60]:kind==='over'?[330,220]:[250];notes.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=kind==='move'?'sine':'triangle';o.frequency.setValueAtTime(f,t+i*.075);g.gain.setValueAtTime(.0001,t+i*.075);g.gain.exponentialRampToValueAtTime(kind==='move'?.025:.07,t+i*.075+.008);g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+.12);o.connect(g).connect(audioContext.destination);o.start(t+i*.075);o.stop(t+i*.075+.13)})}catch{}}
function render(newCell=null,merges=[]){board.replaceChildren();for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const n=grid[r][c],cell=document.createElement('div'),key=`${r}-${c}`;cell.className='tile';if(key===newCell)cell.classList.add('pop');else if(merges.includes(key))cell.classList.add('merge');cell.dataset.n=n;cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',n?String(n):t('empty'));cell.textContent=n||'';board.appendChild(cell)}scoreEl.textContent=score.toLocaleString(lang==='ko'?'ko-KR':'en-US');const best=Math.max(getBest(),score);bestEl.textContent=best.toLocaleString(lang==='ko'?'ko-KR':'en-US');if(best>getBest())setBest(best);comboEl.innerHTML=combo>1?`🔥 <strong>${Math.min(combo,5)}× COMBO</strong> · ${t('combo')} ${combo}`:combo===1?t('first'):t('comboPrompt');comboEl.classList.remove('active');if(combo>1){void comboEl.offsetWidth;comboEl.classList.add('active')}statusEl.textContent=won&&!over?t('win'):'';if(over)showOverlay(t('overTitle'),`${t('final')} ${score.toLocaleString(lang==='ko'?'ko-KR':'en-US')}`)}
function slide(line){const nums=line.filter(Boolean),out=[],mergedIndices=[];let gain=0;for(let i=0;i<nums.length;i++){if(nums[i]===nums[i+1]){const n=nums[i]*2;mergedIndices.push(out.length);out.push(n);gain+=n;i++}else out.push(nums[i])}while(out.length<SIZE)out.push(0);return{out,gain,mergedIndices}}
function canMove(){if(emptyCells().length)return true;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if((r+1<SIZE&&grid[r][c]===grid[r+1][c])||(c+1<SIZE&&grid[r][c]===grid[r][c+1]))return true;return false}
function showOverlay(title,description){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayText').textContent=description;overlay.hidden=false}
function move(dir){if(over||!overlay.hidden)return;const next=grid.map(row=>row.slice()),merges=[];let gain=0;for(let i=0;i<SIZE;i++){const coords=[];for(let j=0;j<SIZE;j++){if(dir==='left')coords.push([i,j]);if(dir==='right')coords.push([i,SIZE-1-j]);if(dir==='up')coords.push([j,i]);if(dir==='down')coords.push([SIZE-1-j,i])}const result=slide(coords.map(([r,c])=>grid[r][c]));gain+=result.gain;result.mergedIndices.forEach(j=>merges.push(coords[j].join('-')));coords.forEach(([r,c],j)=>next[r][c]=result.out[j])}if(next.every((row,r)=>row.every((n,c)=>n===grid[r][c])))return;grid=next;if(gain){combo++;score+=gain*Math.min(combo,5);sound('merge')}else{combo=0;sound('move')}const cell=spawn(),justWon=!won&&grid.some(row=>row.some(n=>n>=2048));if(justWon){won=true;sound('win')}if(!canMove()){over=true;sound('over')}render(cell,merges);if(justWon&&!over){showOverlay(t('winTitle'),t('winText'));document.getElementById('overlayButton').textContent=t('continue')}else if(over){document.getElementById('overlayButton').textContent=t('again')}}
function start(){grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));score=0;combo=0;won=false;over=false;overlay.hidden=true;document.getElementById('overlayButton').textContent=t('again');spawn();spawn();render()}
document.getElementById('language').addEventListener('click',()=>{lang=lang==='ko'?'en':'ko';try{localStorage.setItem('numberMergeLanguage',lang)}catch{}applyLanguage()});document.getElementById('restart').addEventListener('click',start);document.getElementById('overlayButton').addEventListener('click',()=>{if(over)start();else overlay.hidden=true});document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;document.getElementById('soundText').textContent=t(soundOn?'soundOn':'soundOff');e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn)sound('move')});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));
document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});
let touchStart=null;board.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});board.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});start();applyLanguage();
</script></body></html>
